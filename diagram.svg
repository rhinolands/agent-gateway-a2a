<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5A5142" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="470" fill="#F4EFE3"/>
  <text x="360" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1B1916">Agent Gateway &amp; A2A Boundary</text>
  <text x="360" y="50" text-anchor="middle" font-size="13" fill="#6B6151">one enforcement point &#183; authN &#8594; policy authZ &#8594; least privilege &#8594; fail closed</text>

  <!-- Callers -->
  <rect x="24" y="150" width="120" height="64" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="84" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#1B1916">Callers</text>
  <text x="84" y="198" text-anchor="middle" font-size="12" fill="#6B6151">human / service</text>
  <line x1="144" y1="182" x2="244" y2="182" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="194" y="174" text-anchor="middle" font-size="11" fill="#A8362B" font-weight="700">authN</text>

  <!-- Gateway -->
  <rect x="248" y="84" width="208" height="252" rx="10" fill="#1B1916"/>
  <text x="352" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#F4EFE3">AGENT GATEWAY</text>
  <text x="352" y="133" text-anchor="middle" font-size="11.5" fill="#C9BCA0">single enforcement point</text>
  <line x1="270" y1="148" x2="434" y2="148" stroke="#4A443B" stroke-width="1"/>
  <text x="270" y="172" font-size="12.5" fill="#EDE6D8">&#8226; AuthN &#8212; JWT / mTLS</text>
  <text x="270" y="194" font-size="12.5" fill="#EDE6D8">&#8226; AuthZ &#8212; policy-as-code</text>
  <text x="270" y="216" font-size="12.5" fill="#EDE6D8">&#8226; per-agent scoped identity</text>
  <text x="270" y="238" font-size="12.5" fill="#EDE6D8">&#8226; rate / quota</text>
  <text x="270" y="260" font-size="12.5" fill="#EDE6D8">&#8226; content safety (guard)</text>
  <text x="270" y="282" font-size="12.5" fill="#F2B2A8">&#8226; fail closed</text>
  <text x="270" y="304" font-size="12.5" fill="#EDE6D8">&#8226; audit (allow + deny)</text>

  <!-- Agents -->
  <rect x="540" y="92" width="152" height="56" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="616" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#1B1916">Agent A</text>
  <text x="616" y="134" text-anchor="middle" font-size="11.5" fill="#6B6151">app-only, scoped</text>
  <rect x="540" y="172" width="152" height="56" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="616" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#1B1916">Agent B</text>
  <text x="616" y="214" text-anchor="middle" font-size="11.5" fill="#6B6151">app-only, scoped</text>
  <line x1="456" y1="140" x2="538" y2="120" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="456" y1="182" x2="538" y2="200" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540 138 C 504 152, 504 168, 540 180" fill="none" stroke="#A8362B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="486" y="163" text-anchor="middle" font-size="11" fill="#A8362B" font-weight="700">A2A</text>

  <!-- Tools -->
  <rect x="540" y="264" width="152" height="62" rx="8" fill="#E7DCC6" stroke="#D6C9AA"/>
  <text x="616" y="290" text-anchor="middle" font-size="15" font-weight="600" fill="#1B1916">MCP tools / APIs</text>
  <text x="616" y="308" text-anchor="middle" font-size="11.5" fill="#6B6151">per-agent allowlist</text>
  <line x1="456" y1="252" x2="538" y2="290" stroke="#5A5142" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="498" y="258" text-anchor="middle" font-size="11" fill="#A8362B" font-weight="700">scoped token</text>

  <!-- notes -->
  <line x1="40" y1="372" x2="680" y2="372" stroke="#DDD2BC" stroke-width="1"/>
  <text x="360" y="394" text-anchor="middle" font-size="11.5" fill="#6B6151">Boundaries: edge (callers&#8594;gateway) &#183; A2A (agent&#8596;agent only via gateway, peer-allowlist) &#183; tool (scoped egress)</text>
  <text x="360" y="414" text-anchor="middle" font-size="11.5" fill="#6B6151">No direct agent-to-agent calls &#183; no user impersonation &#183; agents never hold a broad secret &#183; every decision audited</text>
  <text x="360" y="436" text-anchor="middle" font-size="12" fill="#A8362B" font-weight="600">Change an agent's reach = a reviewed policy change, not a code edit.</text>
</svg>
